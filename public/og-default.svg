<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CANG — Vietnam B2B Industrial Marketplace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b2d"/>
      <stop offset="60%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#2b3852"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4941a"/>
      <stop offset="100%" stop-color="#d4941a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Industrial silhouette -->
  <g fill="#ffffff" fill-opacity="0.05">
    <rect x="760" y="430" width="90" height="160"/>
    <rect x="860" y="380" width="70" height="210"/>
    <rect x="940" y="460" width="110" height="130"/>
    <rect x="1060" y="410" width="80" height="180"/>
    <rect x="690" y="480" width="60" height="110"/>
  </g>
  <g fill="#d4941a" fill-opacity="0.22">
    <rect x="880" y="330" width="14" height="60"/>
    <rect x="1085" y="360" width="14" height="60"/>
  </g>

  <!-- Mark -->
  <g transform="translate(88 88)">
    <rect width="96" height="96" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#d4941a" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M67.5 33.6c-4.2-4.8-10.2-7.5-17.1-7.5-12.9 0-21.9 9.3-21.9 21.9s9 21.9 21.9 21.9c6.9 0 12.9-2.7 17.1-7.5" stroke="#d4941a" stroke-width="9.6" stroke-linecap="round" fill="none"/>
    <circle cx="69.6" cy="48" r="6.3" fill="#d4941a"/>
  </g>

  <text x="208" y="152" font-family="Manrope, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="6">CANG</text>
  <text x="212" y="186" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#d4941a" letter-spacing="5">CANG.VN</text>

  <rect x="88" y="240" width="420" height="4" rx="2" fill="url(#rule)"/>

  <text x="88" y="330" font-family="Manrope, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Vietnam&#8217;s B2B</text>
  <text x="88" y="398" font-family="Manrope, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">industrial marketplace</text>

  <text x="88" y="452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#a3adbb">Verified manufacturers &#183; RFQs &#183; Trade Assurance</text>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#e6eaf2">
    <rect x="88" y="498" width="196" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="112" y="527">Verified factories</text>
    <rect x="300" y="498" width="168" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="324" y="527">Escrow-backed</text>
    <rect x="484" y="498" width="212" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="508" y="527">Freight &#38; inspection</text>
  </g>
</svg>
